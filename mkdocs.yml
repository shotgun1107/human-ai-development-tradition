site_name: 인간–AI 공동 개발 전통
site_description: 여러 AI 세대가 검증된 경험과 작업방식을 이어받기 위한 연구·기획 문서
docs_dir: docs/tradition
site_dir: .mkdocs-site

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 어두운 테마로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: 밝은 테마로 전환
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 홈: README.md
  - 목적과 철학: purpose-and-philosophy.md
  - 중앙 시스템 v2:
      - 공통 기준선: central-system-v2-common-baseline.md
      - 기획·설계 브리프: central-system-v2-design-brief.md
      - S0 준비 기준선: central-system-v2-1-s0-preparation-baseline.md
      - S0 분리 운영안: s0-isolated-design-execution-and-judgment-plan.md
      - v2.1 제한 수정 후보: central-system-v2-integrated-candidate-v2-1-view.md
      - v2 통합 후보(동결): central-system-v2-integrated-candidate-view.md
  - 문헌 조사:
      - 1차 분야 횡단 조사: research.md
      - 2차 인간–AI 공동 전통 조사: research-human-ai-joint-tradition.md
  - 이전 설계 경쟁:
      - 입력 기준선 v1.1: design-competition-baseline-v1.1.md
      - 기준선 v1.0 해시 기록: design-competition-baseline-v1.md
      - 공통 과업 규격: design-competition-brief.md
  - 이전 후보(하위 설계 참고): candidate-system-design-v1.md
  - 기존 설계 초안:
      - 시스템 설계: system-design.md
      - 월간 회고 플레이북: monthly-review-playbook.md
      - 로드맵과 평가: roadmap-and-evaluation.md

extra:
  generator: false
